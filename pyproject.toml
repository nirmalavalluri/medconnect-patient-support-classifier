[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "medconnect-classifier"
version = "0.1.0"
description = "Multi-provider AI patient support classifier for healthcare"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.75.0",
    "anthropic>=0.49.0",
    "google-genai>=1.10.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
